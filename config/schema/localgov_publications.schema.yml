filter_settings.localgov_publications_heading_ids:
  type: filter
  label: 'Automatically apply identifiers (anchors) to headings in content'
  mapping:
    keep_existing_ids:
      type: boolean
      label: 'Keep existing IDs'

block.settings.publication_navigation:*:
  type: block_settings
  label: 'Publication navigation block'
  mapping:
    collapsible:
      type: boolean
      label: 'Collapsible'
    collapse_width:
      type: integer
      label: 'Collapse width '
